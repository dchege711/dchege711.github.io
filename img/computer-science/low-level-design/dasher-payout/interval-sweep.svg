<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"
  role="img" aria-labelledby="title description">
  <title id="title">Sweeping delivery intervals to count concurrent deliveries</title>
  <desc id="description">
    Sweep from left to right through sorted endpoints. D1 is accepted at 10:00,
    D2 at 10:05, and D3 at 10:10, saving counts of 1, 2, and 3 respectively,
    including the newly accepted delivery. D1 is delivered at 10:15, D2 is
    cancelled at 10:20, and D3 is delivered at 10:25. The active count after
    each event is 1, 2, 3, 2, 1, 0. Only delivered intervals earn payout,
    using their saved acceptance count.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="420" rx="12" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="32" y="36" font-size="22" font-weight="bold">Sweep delivery intervals in time order</text>
    <text x="32" y="62" font-size="15" fill="#475569">Accept: +1 and save count (including self). Deliver or cancel: -1.</text>

    <g stroke="#e2e8f0" stroke-dasharray="4 5">
      <path d="M 180 100 V 278 M 300 100 V 278 M 420 100 V 278"/>
      <path d="M 540 100 V 278 M 660 100 V 278 M 780 100 V 278"/>
    </g>
    <path d="M 420 95 V 278" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="430" y="96" font-size="14" fill="#7c3aed">Sweep at 10:10: 3 active</text>

    <g font-size="16" font-weight="bold">
      <text x="32" y="139">D1 (n = 1)</text>
      <text x="32" y="195">D2 (n = 2)</text>
      <text x="32" y="251">D3 (n = 3)</text>
    </g>
    <g stroke-width="8">
      <path d="M 180 134 H 540" stroke="#2563eb"/>
      <path d="M 300 190 H 660" stroke="#b45309"/>
      <path d="M 420 246 H 780" stroke="#0f766e"/>
    </g>
    <g fill="#ffffff" stroke-width="3">
      <circle cx="180" cy="134" r="7" stroke="#2563eb"/>
      <circle cx="300" cy="190" r="7" stroke="#b45309"/>
      <circle cx="420" cy="246" r="7" stroke="#0f766e"/>
    </g>
    <rect x="533" y="127" width="14" height="14" rx="2" fill="#2563eb"/>
    <path d="M 653 183 L 667 197 M 653 197 L 667 183" stroke="#b45309" stroke-width="3"/>
    <rect x="773" y="239" width="14" height="14" rx="2" fill="#0f766e"/>
    <g font-size="14">
      <text x="558" y="139" fill="#2563eb">delivered</text>
      <text x="678" y="195" fill="#b45309">cancelled</text>
      <text x="798" y="251" fill="#0f766e">delivered</text>
    </g>

    <path d="M 160 278 H 820" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <g text-anchor="middle" font-size="14" fill="#475569">
      <text x="180" y="302">10:00</text>
      <text x="300" y="302">10:05</text>
      <text x="420" y="302">10:10</text>
      <text x="540" y="302">10:15</text>
      <text x="660" y="302">10:20</text>
      <text x="780" y="302">10:25</text>
    </g>
    <text x="32" y="337" font-size="14">Active after event</text>
    <g text-anchor="middle" font-size="19" font-weight="bold">
      <text x="180" y="338">1</text>
      <text x="300" y="338">2</text>
      <text x="420" y="338" fill="#7c3aed">3</text>
      <text x="540" y="338">2</text>
      <text x="660" y="338">1</text>
      <text x="780" y="338">0</text>
    </g>
    <text x="32" y="380" font-size="15">Delivered payout = base_rate * (1 + bonus_factor * saved n)</text>
    <text x="32" y="402" font-size="14" fill="#475569">D1 uses n = 1; D3 uses n = 3. D2 affects concurrency but earns no payout.</text>
  </g>
</svg>
